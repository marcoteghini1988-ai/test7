 <text x="55" y="591" fill="#e6effb" font-size="17.4" font-family="Arial,sans-serif">Marca un vitale colpito da una salva reale.</text><text x="55" y="614" fill="#e6effb" font-size="17.4" font-family="Arial,sans-serif">Nel round seguente un secondo tiro valido</text><text x="55" y="637" fill="#e6effb" font-size="17.4" font-family="Arial,sans-serif">sullo stesso bersaglio può applicare una</text><text x="55" y="660" fill="#e6effb" font-size="17.4" font-family="Arial,sans-serif">frattura; la marca da sola non infligge</text><text x="55" y="683" fill="#e6effb" font-size="17.4" font-family="Arial,sans-serif">danno.</text>
