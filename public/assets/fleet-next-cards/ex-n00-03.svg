 <text x="55" y="591" fill="#e6effb" font-size="17.4" font-family="Arial,sans-serif">Se i Motori sono operativi e la carta è</text><text x="55" y="614" fill="#e6effb" font-size="17.4" font-family="Arial,sans-serif">pronta, una volta per battaglia devia un</text><text x="55" y="637" fill="#e6effb" font-size="17.4" font-family="Arial,sans-serif">colpo singolo diretto a un vitale ancora</text><text x="55" y="660" fill="#e6effb" font-size="17.4" font-family="Arial,sans-serif">integro; non annulla salve da baluardo e</text><text x="55" y="683" fill="#e6effb" font-size="17.4" font-family="Arial,sans-serif">consuma la carta.</text>
