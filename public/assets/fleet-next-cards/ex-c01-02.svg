 <text x="55" y="591" fill="#e6effb" font-size="17.4" font-family="Arial,sans-serif">Se i Motori sono operativi, marca i Motori</text><text x="55" y="614" fill="#e6effb" font-size="17.4" font-family="Arial,sans-serif">avversari e abilita un colpo madre su quel</text><text x="55" y="637" fill="#e6effb" font-size="17.4" font-family="Arial,sans-serif">componente nel normale ordine di</text><text x="55" y="660" fill="#e6effb" font-size="17.4" font-family="Arial,sans-serif">risoluzione; non anticipa automaticamente</text><text x="55" y="683" fill="#e6effb" font-size="17.4" font-family="Arial,sans-serif">cure o contrattacchi.</text>
