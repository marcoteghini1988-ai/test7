 <text x="55" y="591" fill="#e6effb" font-size="17.4" font-family="Arial,sans-serif">Una volta per battaglia, dopo aver marcato</text><text x="55" y="614" fill="#e6effb" font-size="17.4" font-family="Arial,sans-serif">due vitali in round differenti, scegli</text><text x="55" y="637" fill="#e6effb" font-size="17.4" font-family="Arial,sans-serif">quale colpire dopo la difesa dichiarata; la</text><text x="55" y="660" fill="#e6effb" font-size="17.4" font-family="Arial,sans-serif">salva resta una sola e può essere</text><text x="55" y="683" fill="#e6effb" font-size="17.4" font-family="Arial,sans-serif">intercettata da baluardo.</text>
