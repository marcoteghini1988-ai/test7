 <text x="55" y="591" fill="#e6effb" font-size="17.4" font-family="Arial,sans-serif">Il prossimo colpo reale della madre contro</text><text x="55" y="614" fill="#e6effb" font-size="17.4" font-family="Arial,sans-serif">un vitale integro ottiene mira stabile: se</text><text x="55" y="637" fill="#e6effb" font-size="17.4" font-family="Arial,sans-serif">il bersaglio resta valido non può essere</text><text x="55" y="660" fill="#e6effb" font-size="17.4" font-family="Arial,sans-serif">deviato da una manovra di mobilità</text><text x="55" y="683" fill="#e6effb" font-size="17.4" font-family="Arial,sans-serif">ordinaria.</text>
