name: PNG HD dalle 70 carte illustrate presenti
on:
  push:
    branches: [main]
    paths:
      - 'public/assets/special-cards/*.svg'
      - 'public/assets/terrain-pvp/*.svg'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render-real-cards:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Installa il rasterizzatore vettoriale
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin
      - name: Allinea i nomi dei 66 fronti speciali, poi crea 70 PNG
        run: |
          node scripts/align-official-special-labels.mjs
          bash scripts/export-official-special-pngs.sh
      - name: Verifica i file generati e registra nel repository
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import struct
          dirs=('special-cards','terrain-pvp')
          files=[p for d in dirs for p in (Path('public/assets')/d).glob('*.png')]
          assert len(files)==70, f"PNG attesi: 70, trovati: {len(files)}"
          for path in files:
              with path.open('rb') as f:
                  magic=f.read(24)
              assert magic[:8]==b'\x89PNG\r\n\x1a\n',path
              assert struct.unpack('>II',magic[16:24])==(512,768),path
          print("OK: 70 PNG illustrati 512x768; Personaggi Boss in attesa")
          PY
          git config user.name "eclissi-asset-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/assets/special-cards/*.png public/assets/terrain-pvp/*.png
          git add public/assets/special-cards/*.svg
          if git diff --cached --quiet; then
            echo "Tutti i PNG ufficiali sono gia' aggiornati"
          else
            git commit -m "Renderizza le 70 illustrazioni presenti in PNG HD"
            git push origin HEAD:main
          fi
