name: PNG HD dalle 82 carte realmente presenti
on:
  push:
    branches: [main]
    paths:
      - 'scripts/export-official-special-pngs.sh'
      - '.github/workflows/export-official-special-pngs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render-real-cards:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Installa il rasterizzatore vettoriale
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin
      - name: Crea 82 PNG HD senza inventare disegni
        run: bash scripts/export-official-special-pngs.sh
      - name: Verifica i file generati e registra nel repository
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import struct
          dirs=('special-cards','boss-characters','terrain-pvp')
          files=[p for d in dirs for p in (Path('public/assets')/d).glob('*.png')]
          assert len(files)==82, f"PNG attesi: 82, trovati: {len(files)}"
          for path in files:
              with path.open('rb') as f:
                  magic=f.read(24)
              assert magic[:8]==b'\x89PNG\r\n\x1a\n',path
              assert struct.unpack('>II',magic[16:24])==(512,768),path
          print("OK: 82 PNG ufficiali 512x768")
          PY
          git config user.name "eclissi-asset-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/assets/special-cards/*.png public/assets/boss-characters/*.png public/assets/terrain-pvp/*.png
          if git diff --cached --quiet; then
            echo "Tutti i PNG ufficiali sono gia' aggiornati"
          else
            git commit -m "Renderizza 82 illustrazioni ufficiali esistenti in PNG HD"
            git push origin HEAD:main
          fi
