name: Cattura plancia battaglia ufficiale
on:
  push:
    paths:
      - .github/workflows/capture-official-battle.yml
  workflow_dispatch:
jobs:
  capture:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Browser automatizzato, senza schermate di prova nel gioco
        run: npm install --no-save --package-lock=false playwright-core
      - name: Avvia la versione reale del gioco
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/vite.log 2>&1 &
          echo $! >/tmp/vite.pid
      - name: Cattura la battaglia effettiva e le 7 carte
        run: |
          node <<'JS'
          const fs=require('node:fs');
          const {execSync}=require('node:child_process');
          const {chromium}=require('playwright-core');
          (async()=>{
            const executablePath=execSync('which google-chrome || which chromium-browser || which chromium',{encoding:'utf8'}).trim();
            const browser=await chromium.launch({executablePath,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            const context=await browser.newContext({viewport:{width:450,height:800},deviceScaleFactor:2,isMobile:true,hasTouch:true,locale:'it-IT',reducedMotion:'reduce'});
            const page=await context.newPage();
            const errors=[];
            page.on('pageerror',err=>errors.push(String(err).slice(0,500)));
            for(let n=0;n<20;n++){
              try{const r=await page.goto('http://127.0.0.1:5173/',{waitUntil:'domcontentloaded',timeout:1200});if(r?.ok())break;}catch{}
              await page.waitForTimeout(800);
            }
            await page.waitForTimeout(1800);
            await page.locator('body').click({position:{x:225,y:400}});
            try{
              await page.getByLabel('Le tue sette carte numeriche').waitFor({timeout:25000});
            }catch(error){
              fs.writeFileSync('/tmp/eclissi-debug.txt',JSON.stringify({errors,body:(await page.locator('body').innerText()).slice(0,6000)}));
              await page.screenshot({path:'/tmp/eclissi-mancata-battaglia.png',fullPage:true});
              throw new Error('Plancia non caricata: '+JSON.stringify({errors,body:(await page.locator('body').innerText()).slice(0,1200)}));
            }
            await page.waitForTimeout(1300);
            const seven=await page.locator('.hand .number-card').count();
            if(seven!==7)throw new Error('Numero carte non uguale a 7: '+seven);
            const four=await page.locator('.ship-enemy .official-original-motor-targets .vessel-engine').count();
            if(four!==4)throw new Error('La nave deve avere quattro bersagli fisici, trovati: '+four);
            const align=await page.evaluate(()=>{
              const hull=document.querySelector('.ship-enemy .official-mother .fleet-ship-img');
              const targets=document.querySelector('.ship-enemy .official-original-motor-targets');
              if(!hull||!targets)return null;
              const a=hull.getBoundingClientRect(),b=targets.getBoundingClientRect();
              return {dx:Math.abs(b.left-(a.left+(a.width-a.height)/2)),
               dy:Math.abs(b.top-a.top),dw:Math.abs(b.width-a.height),
               vitalNames:[...targets.querySelectorAll('.vessel-engine')].map(e=>e.getAttribute('aria-label'))};
            });
            if(!align||align.dx>2||align.dy>2||align.dw>2)
              throw new Error('Il vecchio sistema di agganci non coincide con la scocca: '+JSON.stringify(align));
            console.log('VITALI FISICI ORIGINALI: '+four+' per nave; SVG e bersagli allineati: '+JSON.stringify(align));
            fs.mkdirSync('docs/screenshots',{recursive:true});
            await page.screenshot({path:'docs/screenshots/plancia-attuale-battaglia.jpg',type:'jpeg',quality:88,fullPage:true,animations:'disabled'});
            // Verify that the original physical target, not a detached HUD tile,
            // actually selects the authoritative vital in the 30+8 UI.
            await page.locator('.ship-enemy .official-original-motor-targets .vessel-engine')
              .first().click({timeout:5000});
            const selected=await page.locator('.formula-target').innerText();
            if(!selected.toLocaleUpperCase('it-IT').includes('MOTORE'))
              throw new Error('Selezione fisica del motore non funzionante: '+selected);
            console.log('TAP BERSAGLIO FISICO -> '+selected);

            // CI-only mount of the ORIGINAL damage renderer, no second game screen.
            // This fixture is never committed, never added to the app or its routes.
            fs.writeFileSync('src/__ci_vital_damage_fixture.jsx',[
              "import React from 'react';",
              "import {createRoot} from 'react-dom/client';",
              "import {newVessel} from './mathDuelEngine.js';",
              "import ShipPhysicalVitals from './ShipPhysicalVitals.jsx';",
              "export function mountDamageFixture(){",
              " const root=document.querySelector('.ship-enemy .official-mother');",
              " if(!root)throw Error('Nave reale mancante');",
              " const previous=root.querySelector('.fleet-ship-img');if(previous)previous.style.opacity='0';",
              " const prevTargets=root.querySelector('.official-original-motor-targets');if(prevTargets)prevTargets.style.opacity='0';",
              " const container=document.createElement('div');",
              " container.style.cssText='position:absolute;inset:0;pointer-events:none;z-index:15';",
              " root.appendChild(container);",
              " const hp={engine:0,weapons:3,shieldGenerator:6,command:10};",
              " const defense={parts:Object.fromEntries(Object.entries(hp).map(([k,v])=>[k,{hp:v,max:10,exposed:true}]))};",
              " createRoot(container).render(React.createElement(ShipPhysicalVitals,{",
              "  side:'enemy',vessel:newVessel('C01',1),defense,canTarget:false,",
              "  impactedVitals:['engine','weapons']",
              " }));",
              " return Object.entries(hp);",
              "}"
            ].join('\n'));
            const demo=await page.evaluate(async()=>{
              const mod=await import('/src/__ci_vital_damage_fixture.jsx');
              return mod.mountDamageFixture();
            });
            await page.waitForTimeout(950);
            const physicalDamage=await page.evaluate(()=>{
              const active=[...document.querySelectorAll('.ship-enemy .official-original-motor-targets')]
                .find(x=>getComputedStyle(x).opacity!=='0');
              if(!active)return null;
              return {ko:active.querySelectorAll('[data-state="destroyed"]').length,
                critical:active.querySelectorAll('[data-state="critical"]').length,
                damaged:active.querySelectorAll('[data-state="damaged"]').length,
                smoke:active.querySelectorAll('.vessel-smoke').length,
                fracture:active.querySelectorAll('.engine-fracture').length};
            });
            if(!physicalDamage||physicalDamage.ko!==1||physicalDamage.critical!==1||
                physicalDamage.damaged!==1||physicalDamage.smoke!==1||
                physicalDamage.fracture!==4)
              throw new Error('Effetti originali di distruzione non montati correttamente: '+JSON.stringify(physicalDamage));
            console.log('STATO DANNI FISICI VERIFICATO: '+JSON.stringify(physicalDamage));
            await page.screenshot({path:'docs/screenshots/plancia-vitali-danneggiati.jpg',
              type:'jpeg',quality:90,fullPage:true,animations:'disabled'});
            console.log('CATTURA DANNI DI PROVA (non partita reale): '+JSON.stringify(demo));
            console.log('CATTURA REALE: '+seven+' carte, '+JSON.stringify({errors}));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plancia-reale-attuale
          path: |
            docs/screenshots/plancia-attuale-battaglia.jpg
            docs/screenshots/plancia-vitali-danneggiati.jpg
            /tmp/eclissi-mancata-battaglia.png
          if-no-files-found: warn
      - name: Pubblica solo la cattura, senza modificare l'app
        run: |
          if [ ! -f docs/screenshots/plancia-attuale-battaglia.jpg ]; then exit 1; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/screenshots/plancia-attuale-battaglia.jpg docs/screenshots/plancia-vitali-danneggiati.jpg
          git commit -m 'Cattura plancia reale e verifica visiva dei quattro vitali fisici'
          git pull --rebase origin main
          git push
