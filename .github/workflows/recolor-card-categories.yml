name: Categorie Arma rossa e Strategia arancione — PNG HD
on:
  push:
    branches: [main]
    paths:
      - 'scripts/recolor-category-panels.py'
      - 'scripts/restore-weapon-fronts.mjs'
      - 'asset-sources/card-text/**'
      - 'asset-sources/weapon-fronts/approved-2026-11-26/**'
      - 'asset-sources/weapon-fronts/lancia-comando-2026-11-27/**'
      - 'asset-sources/weapon-fronts/condensatore-tempesta-2026-11-27/**'
      - 'asset-sources/weapon-fronts/lotto-giudizio-fuoco-2026-11-27/**'
      - 'src/fleetNext/approvedWeaponIntegration.json'
      - '.github/workflows/recolor-card-categories.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: eclissi-category-panels
  cancel-in-progress: true
jobs:
  recolor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow numpy
      - run: node scripts/restore-weapon-fronts.mjs
      - run: python scripts/recolor-category-panels.py --self-test
      - run: python scripts/recolor-category-panels.py
      - run: node --test src/fleetNextCardCategory.test.js
      - uses: actions/upload-artifact@v4
        with:
          name: verifica-pannelli-arme-rosse
          path: docs/collaudi/categorie-2026-11-26/
      - name: Salva i PNG verificati e il registro sul repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/fleet-weapon-fronts-red docs/riferimenti-carte/basi-rarita-ufficiali-2026-11-24/arma-rosso docs/collaudi/categorie-2026-11-26 src/fleetNext/redWeaponFronts.json
          git add public/assets/fleet-weapon-fronts/weapon-base-ionic-*.png
          git add public/assets/fleet-weapon-fronts/weapon-designed-ionic-nucleo-folgore*.png
          # The same verified archive produces these native PNGs; no recompression.
          git add -f public/assets/fleet-weapon-fronts/weapon-designed-ionic-sonda-ionica*.png
          git add -f public/assets/fleet-weapon-fronts/weapon-designed-ionic-martello-tuono*.png
          git add -f public/assets/fleet-weapon-fronts/weapon-designed-ionic-lancia-comando-ionico*.png
          git add -f public/assets/fleet-weapon-fronts/weapon-designed-ionic-condensatore-tempesta*.png
          git add -f public/assets/fleet-weapon-fronts/weapon-designed-ionic-giudizio-temporale*.png
          git add -f public/assets/fleet-weapon-fronts/weapon-designed-plasma-mortaio-magmatico*.png
          git add -f public/assets/fleet-weapon-fronts/weapon-designed-plasma-inceneritore-rotante*.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Materializza i PNG approvati e le basi HD traducibili senza alterarne i byte'
          git pull --rebase origin main
          git push origin HEAD:main
