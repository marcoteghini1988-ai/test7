name: Test8 — Punto 22 battle checks
on:
  push:
    branches:
      - work/test8-punto22-fusioni-2026-11-06
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run verify:logic
      - run: npm run build
      - run: npm run preflight
